name: Meme Token Agent

on:
  schedule:
    - cron: "*/15 * * * *"   # jalan tiap 15 menit (GitHub Actions gratis untuk repo publik)
  workflow_dispatch: {}       # biar bisa di-trigger manual dari tab "Actions"

jobs:
  run-agent:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # perlu buat commit balik state.json
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Jalankan agent (sekali)
        env:
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}   # opsional, kosongin aja kalau pakai default publik
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py once

      - name: Simpan state.json & data dashboard biar gak notif dobel + website ke-update
        run: |
          git config user.name "meme-agent-bot"
          git config user.email "actions@github.com"
          git add state.json docs/data.json tracked_performance.json
          git diff --staged --quiet || git commit -m "chore: update state & dashboard data [skip ci]"
          git push
